<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buy cheap: იპოვე ყველაზე დაბალი ფასი</title>
<meta name="description" content="ერთი ძიება, ყველა ქართული მაღაზია. შეადარე ფასები და იპოვე ყველაზე იაფი.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f3f5fa; --surface:#ffffff; --ink:#0f1b33; --muted:#5d6b85; --line:#dfe4ee;
    --brand:#1b4fd8; --brand-ink:#ffffff; --brand-soft:#e8eefc;
    --good:#0a8f4e; --good-soft:#e3f6ec;
    --warn-soft:#fff3dc; --warn-ink:#7a4b00;
    --shadow:0 1px 2px rgba(15,27,51,.06), 0 8px 24px rgba(15,27,51,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1424; --surface:#151e33; --ink:#eef2fb; --muted:#9aa8c4; --line:#27334d;
      --brand:#6f95ff; --brand-ink:#0d1424; --brand-soft:#1b2a52;
      --good:#4ad28c; --good-soft:#12342a;
      --warn-soft:#3a2d12; --warn-ink:#f2c879;
      --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:"Noto Sans Georgian", system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap { max-width:860px; margin:0 auto; padding:0 18px; }

  /* ზედა ნაწილი */
  header.top { padding:18px 0 0; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-weight:800; font-size:20px; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
  .logo i { width:30px; height:30px; border-radius:9px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-style:normal; font-size:17px; }

  .hero { padding:44px 0 26px; }
  .hero h1 { margin:0 0 10px; font-size:clamp(30px, 6vw, 46px); line-height:1.15; font-weight:800; letter-spacing:-.02em; max-width:15em; }
  .hero p { margin:0 0 26px; color:var(--muted); font-size:17px; max-width:34em; }

  .search { display:flex; gap:8px; background:var(--surface); padding:8px; border-radius:18px; box-shadow:var(--shadow); border:1px solid var(--line); }
  .search:focus-within { border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  .search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:17px; padding:12px 14px; }
  .search input::placeholder { color:var(--muted); }
  .search button { border:0; background:var(--brand); color:var(--brand-ink); font:inherit; font-weight:700; font-size:16px; padding:0 26px; border-radius:12px; cursor:pointer; }
  .search button:hover { filter:brightness(1.08); }
  .search button:focus-visible, .chip:focus-visible, select:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
  .chips span { color:var(--muted); font-size:14px; margin-right:2px; }
  .chip { border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; padding:7px 14px; border-radius:99px; cursor:pointer; }
  .chip:hover { border-color:var(--brand); color:var(--brand); }

  /* შედეგები */
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:30px 0 12px; flex-wrap:wrap; }
  .summary { font-weight:500; }
  .summary b { color:var(--good); }
  select { font:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }

  .banner { margin:0 0 12px; padding:10px 14px; border-radius:12px; font-size:14px; background:var(--brand-soft); color:var(--ink); }
  .banner.warn { background:var(--warn-soft); color:var(--warn-ink); }

  .list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .item { display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; text-decoration:none; color:inherit; box-shadow:var(--shadow); }
  a.item:hover { border-color:var(--brand); }
  .item.best { border:2px solid var(--good); background:linear-gradient(0deg, var(--surface), var(--surface)), var(--good-soft); padding:13px 15px; }
  .mono { width:46px; height:46px; border-radius:13px; display:grid; place-items:center; font-weight:800; font-size:18px; color:#fff; }
  .name { font-weight:500; font-size:16px; line-height:1.35; overflow-wrap:anywhere; }
  .store { color:var(--muted); font-size:14px; margin-top:2px; }
  .tag { display:inline-block; background:var(--good); color:#fff; font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; margin-right:8px; vertical-align:1px; }
  .priceBox { text-align:right; white-space:nowrap; }
  .price { font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .best .price { color:var(--good); }
  .delta { font-size:13px; color:var(--muted); }

  .state { text-align:center; padding:44px 16px; color:var(--muted); }
  .state strong { display:block; color:var(--ink); font-size:18px; margin-bottom:4px; }

  .skeleton { height:76px; border-radius:16px; background:var(--surface); border:1px solid var(--line); position:relative; overflow:hidden; }
  .skeleton::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, var(--brand-soft), transparent); transform:translateX(-100%); animation:sh 1.2s infinite; }
  @keyframes sh { to { transform:translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { .skeleton::after { animation:none; } }

  footer { padding:36px 0 48px; color:var(--muted); font-size:13px; }

  @media (max-width:520px) {
    .search { flex-direction:column; }
    .search button { padding:14px; }
    .item { grid-template-columns:auto 1fr; }
    .priceBox { grid-column:1 / -1; text-align:left; display:flex; align-items:baseline; gap:10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><i>₾</i> Buy cheap</div>
  </header>

  <section class="hero">
    <h1>იპოვე ყველაზე დაბალი ფასი ერთი ძიებით</h1>
    <p>ჩაწერე რასაც ეძებ და ერთდროულად შევადარებთ ქართულ ონლაინ მაღაზიებს.</p>

    <form class="search" id="form" role="search">
      <input id="q" type="search" autocomplete="off" placeholder="მაგ: ბავშვის შამპუნი, sony ტელევიზორი, მტვერსასრუტი" aria-label="რას ეძებ?" autofocus>
      <button type="submit">ძებნა</button>
    </form>

    <div class="chips" id="chips">
      <span>სცადე:</span>
      <button class="chip" type="button">ძაღლის საკვები 20 კგ</button>
      <button class="chip" type="button">ბავშვის შამპუნი</button>
      <button class="chip" type="button">sony ტელევიზორი</button>
      <button class="chip" type="button">მტვერსასრუტი</button>
    </div>
  </section>

  <section id="results" aria-live="polite">
    <div class="toolbar" id="toolbar" hidden>
      <div class="summary" id="summary"></div>
      <select id="sort" aria-label="დალაგება">
        <option value="asc">იაფიდან ძვირისკენ</option>
        <option value="desc">ძვირიდან იაფისკენ</option>
      </select>
    </div>
    <div class="banner" id="note" hidden></div>
    <div class="banner warn" id="errors" hidden></div>
    <ul class="list" id="list"></ul>
    <div class="state" id="state" hidden></div>
  </section>

  <footer>ფასები და ხელმისაწვდომობა შეიძლება შეიცვალოს. საბოლოო ფასი ყოველთვის გადაამოწმე მაღაზიის გვერდზე.</footer>
</div>

<script>
// ცოცხალი ძიების მისამართი. ახლა ცარიელია და საიტი ტესტურ მონაცემებზე მუშაობს.
// მოგვიანებით აქ ჩავწერთ ჩვენი Cloudflare Worker-ის მისამართს.
const API_URL = "";

const SAMPLE = [
  { name: "ძაღლის საკვები Pedigree 3 კგ", store: "Zootopia", price: 28.9, url: "#" },
  { name: "ძაღლის საკვები Pedigree 3 კგ", store: "Smartpet", price: 26.5, url: "#" },
  { name: "ძაღლის საკვები Royal Canin Medium 15 კგ", store: "Zoolife", price: 189, url: "#" },
  { name: "ძაღლის საკვები Purina Dog Chow 20 კგ", store: "Extra.ge", price: 139, url: "#" },
  { name: "ძაღლის საკვები Purina Dog Chow 20 კგ", store: "4pets", price: 129, url: "#" },
  { name: "ბავშვის შამპუნი Johnson's 300 მლ", store: "Veli", price: 9.5, url: "#" },
  { name: "ბავშვის შამპუნი Johnson's 300 მლ", store: "Extra.ge", price: 10.9, url: "#" },
  { name: "Sony Bravia 55 დიუიმი ტელევიზორი", store: "Veli", price: 1899, url: "#" },
  { name: "Sony Bravia 55 დიუიმი ტელევიზორი", store: "Extra.ge", price: 1849, url: "#" },
  { name: "მტვერსასრუტი Philips PowerPro", store: "Extra.ge", price: 329, url: "#" },
  { name: "მტვერსასრუტი Philips PowerPro", store: "Veli", price: 315, url: "#" }
];

const $ = id => document.getElementById(id);
const $q = $("q"), $list = $("list"), $state = $("state"), $note = $("note"),
      $errors = $("errors"), $toolbar = $("toolbar"), $summary = $("summary"), $sort = $("sort");
let results = [];

const EMPTY_HTML = "<strong>რას ეძებ დღეს?</strong>ჩაწერე პროდუქტი ზემოთ ან აირჩიე მაგალითი.";

// ქართული დაბოლოებებისთვის სიტყვის დასაწყისს ვადარებთ (ბავშვის ~ ბავშვი)
function matches(text, query) {
  const t = text.toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(tok => {
    const stem = tok.length > 4 ? tok.slice(0, tok.length - 2) : tok;
    return t.includes(stem);
  });
}

const fmt = n => n.toFixed(2).replace(/\.00$/, "") + " ₾";

// მაღაზიას სახელის მიხედვით ყოველთვის ერთი და იგივე ფერი ექნება
function storeColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 42%)`;
}

function showState(html) { $state.innerHTML = html; $state.hidden = false; }

function showSkeleton() {
  $list.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const s = document.createElement("li");
    s.className = "skeleton";
    $list.appendChild(s);
  }
  $state.hidden = true;
}

async function search(query) {
  const q = (query ?? $q.value).trim();
  $errors.hidden = true;
  $note.hidden = true;
  if (!q) { results = []; render(); return; }

  if (!API_URL) {
    $note.textContent = "ეს ტესტური მონაცემებია. რეალური ფასები მალე დაემატება.";
    $note.hidden = false;
    results = SAMPLE.filter(p => matches(p.name + " " + p.store, q));
    render(q);
    return;
  }

  showSkeleton();
  try {
    const r = await fetch(API_URL + "?q=" + encodeURIComponent(q));
    const j = await r.json();
    results = j.results || [];
    if (j.failed && j.failed.length) {
      $errors.textContent = "ამ მაღაზიებმა ვერ გვიპასუხა: " + j.failed.join(", ") + ". დანარჩენი შედეგები ქვემოთაა.";
      $errors.hidden = false;
    }
  } catch (e) {
    results = [];
    $list.innerHTML = "";
    showState("<strong>ძიება ვერ მოხერხდა</strong>შეამოწმე ინტერნეტი და სცადე თავიდან.");
    $toolbar.hidden = true;
    return;
  }
  render(q);
}

function render(q) {
  $list.innerHTML = "";
  if (!results.length) {
    $toolbar.hidden = true;
    showState(q
      ? `<strong>„${q.replace(/[<>&]/g, "")}“ ვერ ვიპოვეთ</strong>სცადე უფრო მოკლე სიტყვა ან ბრენდის სახელი.`
      : EMPTY_HTML);
    return;
  }
  $state.hidden = true;
  $toolbar.hidden = false;

  const dir = $sort.value === "desc" ? -1 : 1;
  const list = [...results].sort((a, b) => (a.price - b.price) * dir);
  const min = Math.min(...results.map(r => r.price));

  const storeCount = new Set(results.map(r => r.store)).size;
  $summary.innerHTML = "";
  $summary.append(`${results.length} შედეგი, ${storeCount} მაღაზია. ყველაზე იაფი: `);
  const b = document.createElement("b");
  b.textContent = fmt(min);
  $summary.append(b);

  list.forEach(p => {
    const isBest = p.price === min;
    const hasLink = p.url && /^https?:\/\//.test(p.url);
    const li = document.createElement("li");
    const el = document.createElement(hasLink ? "a" : "div");
    el.className = "item" + (isBest ? " best" : "");
    if (hasLink) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; }

    const mono = document.createElement("div");
    mono.className = "mono";
    mono.style.background = storeColor(p.store);
    mono.textContent = p.store.trim().charAt(0).toUpperCase();

    const mid = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = p.name;
    const store = document.createElement("div");
    store.className = "store";
    if (isBest) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "ყველაზე იაფი";
      store.appendChild(tag);
    }
    store.append(p.store);
    mid.append(name, store);

    const pb = document.createElement("div");
    pb.className = "priceBox";
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = fmt(p.price);
    pb.appendChild(price);
    if (!isBest) {
      const d = document.createElement("div");
      d.className = "delta";
      d.textContent = "+" + fmt(p.price - min) + " ყველაზე იაფთან შედარებით";
      pb.appendChild(d);
    }

    el.append(mono, mid, pb);
    li.appendChild(el);
    $list.appendChild(li);
  });
}

$("form").addEventListener("submit", e => { e.preventDefault(); search(); });
$sort.addEventListener("change", () => render($q.value.trim()));
$("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) { $q.value = e.target.textContent; search(); }
});
showState(EMPTY_HTML);
</script>
</body>
</html>
